[commit.generation]
command = "pi -p --model openai/gpt-5.6-luna --thinking off --no-mcp -ne -ns -nt --no-session"


[post-switch]
tmux = """
S={{ branch | sanitize }}
W={{ worktree_path }}
# tmux new-session -d -s "$S" -c "$W" -n dev
tmux rename-window "$S"
"""

